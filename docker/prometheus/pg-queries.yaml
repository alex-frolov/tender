# Tender Platform — кастомные query для postgres-exporter (ops/observability.md §1, §4)
# Подключаются через PG_EXPORTER_QUERIES_PATH (/etc/postgres_exporter/queries.yaml).
# Формат: map { namespace: { query, metrics } } — метрика называется <namespace>_<column>.
#
# Покрытие §1 «PG: соединения, slow queries, размер партиций»:
#   - соединения: дефолтные метрики pg_stat_database_numbackends, pg_stat_activity_*;
#   - размер партиций: кастомный query ниже (tender_partition_size_*);
#   - slow queries: pg_stat_statements (tender_statements_*) — учёт по
#     нормализованным запросам; плюс аппроксимация по долгим активным
#     запросам (tender_long_queries_*), которая видит и то, что «висит»
#     прямо сейчас, а не только накопленную статистику.

# Размер таблиц/партиций audit_log и auction_bids (дашборд Growth, §4).
# Обе таблицы партиционированы по месяцам (Version20260822180000/190000):
# relkind='p' — родитель (в pg_total_relation_size он почти пуст, данные
# лежат в партициях), relkind='r' — сами партиции audit_log_YYYY_MM /
# auction_bids_YYYY_MM и DEFAULT-партиции. Двойного счёта нет:
# pg_total_relation_size по родителю не рекурсирует в партиции.
tender_partition_size:
  query: >
    SELECT
      n.nspname AS schemaname,
      c.relname AS relname,
      pg_total_relation_size(c.oid) AS bytes
    FROM pg_class c
    JOIN pg_namespace n ON n.oid = c.relnamespace
    WHERE n.nspname = 'public'
      AND c.relkind IN ('r', 'p')
      AND (c.relname LIKE 'audit_log%' OR c.relname LIKE 'auction_bids%')
  metrics:
    - schemaname:
        usage: "LABEL"
        description: "Схема таблицы"
    - relname:
        usage: "LABEL"
        description: "Имя таблицы или партиции"
    - bytes:
        usage: "GAUGE"
        description: "Полный размер таблицы/партиции (данные + индексы) в байтах"

# Активные запросы дольше 2 сек — что «висит» в моменте (pg_stat_statements
# показывает накопленную статистику, но не текущие зависшие запросы).
tender_long_queries:
  query: >
    SELECT
      count(*) AS count
    FROM pg_stat_activity
    WHERE state = 'active'
      AND now() - query_start > interval '2 seconds'
  metrics:
    - count:
        usage: "GAUGE"
        description: "Число активных запросов, выполняющихся дольше 2 сек"

# Сводка pg_stat_statements: агрегаты, а не
# top-N — метка per-query дала бы кардинальность в тысячи серий. Для разбора
# конкретных запросов идут в саму вьюху (SELECT ... FROM pg_stat_statements
# ORDER BY total_exec_time DESC).
#
# ЗАВИСИМОСТЬ: расширение pg_stat_statements. Оно включается
# shared_preload_libraries в docker-compose(.prod).yml и создаётся миграцией
# Version20260822150000. Там, где сервер поднят без preload, этот namespace
# отдаёт ошибку скрейпа и пропускается — остальные метрики не страдают.
tender_statements:
  query: >
    SELECT
      count(*) AS tracked,
      COALESCE(sum(calls), 0) AS calls,
      COALESCE(sum(total_exec_time), 0) / 1000 AS exec_seconds,
      count(*) FILTER (WHERE mean_exec_time > 100) AS slow
    FROM pg_stat_statements
  metrics:
    - tracked:
        usage: "GAUGE"
        description: "Число нормализованных запросов под учётом"
    - calls:
        usage: "COUNTER"
        description: "Суммарное число вызовов запросов с момента сброса статистики"
    - exec_seconds:
        usage: "COUNTER"
        description: "Суммарное время выполнения запросов (секунды) с момента сброса"
    - slow:
        usage: "GAUGE"
        description: "Число запросов со средним временем выполнения > 100 мс"
