# Tender Platform — конфигурация Prometheus (dev, ops/observability.md)
# Сервис монтируется в docker-compose.yml (service prometheus).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"
  - "rules.yml"
  - "slo-rules.yml"

scrape_configs:
  # Приложение (Symfony): /metrics — app-эндпоинт (src/Infrastructure/Http/
  # MetricsController, ops/observability.md §1); nginx location = /metrics
  # (docker/nginx/default.conf) проксирует на app:9000.
  - job_name: "app"
    metrics_path: /metrics
    static_configs:
      - targets: ["web:80"]
        labels:
          environment: "dev"
          service: "app"

  # php-fpm: экспортёр тянет /status через nginx (pm.status_path=/status).
  - job_name: "php-fpm"
    static_configs:
      - targets: ["php-fpm-exporter:9253"]
        labels:
          environment: "dev"
          service: "php-fpm"

  # PostgreSQL (порт 5432 — внутренний, наружу не публикуется).
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          environment: "dev"
          service: "postgres"

  # Redis.
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          environment: "dev"
          service: "redis"

  # RabbitMQ: rabbitmq_prometheus (встроен в образы 4.x, порт 15692).
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          environment: "dev"
          service: "rabbitmq"

  # Mercure-хаб (docker/mercure/Dockerfile, v0.16.3 + локальный патч /metrics):
  # native метрики mercure_subscribers_connected / mercure_subscribers_total /
  # mercure_updates_total. Recording-правило sse_connections (rules.yml) алиасит
  # mercure_subscribers_connected для дашборда. sse_delivery_latency в v0.16
  # недоступен (нет latency-метрик хаба) — см. ops/observability.md §1.
  - job_name: "mercure"
    metrics_path: /metrics
    static_configs:
      - targets: ["mercure:80"]
        labels:
          environment: "dev"
          service: "mercure"

  # Внешний аптайм-чек (observability-roadmap.md #9): blackbox-exporter probe
  # на /health/ready через nginx (web:80). probe_success == 1 — стек принял
  # запрос и отдал 200 (app+db+redis+rabbitmq+mercure — см. /health/ready).
  # Алерт HealthReadyDown (alerts.yml).
  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://web/health/ready"
        labels:
          environment: "dev"
          service: "app"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Host-метрики (observability-roadmap.md #8): диск/CPU/RAM VM, где живут
  # volume'ы. Алерт DiskSpaceLow и панели Platform-дашборда (node_filesystem_*,
  # node_cpu_*, node_memory_*).
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          environment: "dev"
          service: "host"
