server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # API + приложение
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # SSE через Mercure — не проксируем (клиенты подключаются напрямую к hub:3008)
    # (discovery-ссылка отдаётся приложением)

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # статика
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
    }
}