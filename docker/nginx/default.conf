server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # Спеки OpenAPI (.yaml) — корректный MIME для Scalar/браузеров
    types {
        application/yaml yaml;
    }

    # API + приложение
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # SSE через Mercure — не проксируем (клиенты подключаются напрямую к hub:3008)
    # (discovery-ссылка отдаётся приложением)

    # php-fpm status для php-fpm-exporter (ops/observability.md §1):
    # pm.status_path=/status → fastcgi app:9000; файл на диске не нужен —
    # статус отдаёт сам пул php-fpm по SCRIPT_NAME = /status.
    location = /status {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /status;
        access_log off;
    }

    # Prometheus-эндпоинт приложения (ops/observability.md §1) — «на вырост»:
    # маршрут /metrics в приложении ещё не реализован (инструментирование —
    # отдельная задача), поэтому таргет app в Prometheus пока down (404).
    # Nginx-локация готова заранее, чтобы не менять инфраструктуру позже.
    location = /metrics {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # статика
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
    }
}