; Загрузка документов (AM-8, POST /documents — multipart).
;
; Дефолты PHP (upload_max_filesize=2M, post_max_size=8M) обрезали загрузку
; раньше, чем до неё доходила проверка приложения DOCUMENT_MAX_FILE_BYTES
; (20 МБ): файл на 3 МБ отклонялся ещё в php-fpm, и приложение об этом
; даже не узнавало.
;
; Значения согласованы между собой и с nginx (client_max_body_size 25m):
; предел файла = предел приложения, тело запроса — с запасом на конверт
; multipart и остальные поля формы.
upload_max_filesize = 20M
post_max_size = 25M

; memory_limit оставлен дефолтным (128M) осознанно: DocumentService читает
; файл целиком в память ($file->getContent()) для хеша и записи в хранилище,
; и 20 МБ в 128M укладываются с запасом.
