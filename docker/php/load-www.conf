; Override php-fpm pool для нагрузочного профиля:
; дефолтный max_children=5 душит пропускную способность ставок (100–200/сек
; при 20 конкурентных VU требуют ~20 воркеров). Монтируется в
; docker-compose.load.yml поверх default pool (ключи переопределяются).
[www]
pm = dynamic
pm.max_children = 30
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 15
