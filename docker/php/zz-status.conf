; php-fpm status endpoint для php-fpm-exporter (ops/observability.md §1).
; Монтируется поверх default pool (www.conf) в docker-compose.yml —
; секция [www] дополняется, остальные ключи пула не переопределяются.
; Внешне endpoint отдаёт nginx по location = /status (docker/nginx/default.conf).
[www]
pm.status_path = /status
