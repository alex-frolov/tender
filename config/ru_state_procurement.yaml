# Плагин ru-state-procurement — конфигурация правил (44-ФЗ/223-ФЗ).
#
# «Конфигурация — внешние данные плагина, не код» (domain/plugins/
# ru-state-procurement.md §3): сроки и пороги меняются редакциями закона,
# поэтому правки этого файла НЕ требуют изменения кода (достаточно cache:clear).
#
# Единицы:
#   - проценты — BPS (×10000): 0.5% = 50, 5% = 500, 30% = 3000;
#   - длительности — секунды;
#   - деньги — minor units (копейки): 30 000 000 ₽ = 300000000.
#
# Структура читается ProcurementConfig (App\RuStateProcurement\Config):
# values = { rules: { timeline: {...}, auction: {...}, security: {...},
# timezone: {...} } }.

rules:
    timeline:
        # Приём заявок для электронного аукциона (44-ФЗ): НМЦК ≤ порога — min
        # дней, выше порога — max дней.
        auction_days_min: 7
        auction_days_max: 15
        # Порог НМЦК 30 млн ₽ в копейках (44-ФЗ, ч. 2 ст. 68).
        auction_threshold_minor: 300000000
        # Электронный конкурс (44-ФЗ, ч. 3 ст. 42).
        competition_days: 15
        # Запрос котировок (44-ФЗ, ч. 3 ст. 74) — рабочие дни (выходные не считаются).
        rfq_working_days: 4
        # Запрос предложений / прямая закупка (коммерческие дефолты ядра).
        rfp_days: 7
        direct_days: 1
        # Сокращённые сроки для СМП/СОНО (44-ФЗ). Применяются к тендерам с
        # признаком СМП; в data-model MVP признак СМП у тендера отсутствует —
        # правило зарезервировано конфигом.
        smp_enabled: true
        smp_auction_days_min: 5
        smp_auction_days_max: 7
    auction:
        # Шаг аукциона 0,5–5% НМЦК (44-ФЗ, ч. 18 ст. 68), в BPS.
        bid_step_min_bps: 50
        bid_step_max_bps: 500
        # Время на шаг 10 минут (44-ФЗ, ч. 7 ст. 68).
        step_duration_sec: 600
        # Антиснайпинг: ставка в последние 10 минут продлевает торги.
        extend_on_last_step: true
        # Продление +10 минут (44-ФЗ, ч. 7 ст. 68).
        extension_duration_sec: 600
        # Лимит продлений за аукцион.
        max_extensions: 10
    security:
        # Обеспечение заявки 0,5–5% НМЦК (44-ФЗ, ч. 15 ст. 44).
        bid_min_bps: 50
        bid_max_bps: 500
        # Обеспечение исполнения контракта 5–30% НМЦК (44-ФЗ, ч. 6 ст. 96).
        contract_min_bps: 500
        contract_max_bps: 3000
    timezone:
        # Доменный часовой пояс по умолчанию; настраивается
        # суперадмином, для РФ — Europe/Moscow (UTC+3).
        default_timezone: Europe/Moscow
