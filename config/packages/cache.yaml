framework:
    cache:
        # Redis для кэша и rate limiter (RL-2: счётчики в Redis, INCR+TTL).
        # Номер БД — параметр redis_db (config/services/infrastructure.yaml):
        # в тестах это 1, чтобы прогон не делил keyspace с dev-стеком.
        # REDIS_URL по контракту — redis://host:port, без пути (.env,
        # docker-compose.yml, CI): номер БД дописывается здесь.
        default_redis_provider: '%env(REDIS_URL)%/%redis_db%'
        app: cache.adapter.redis
        system: cache.adapter.redis
