# yaml-language-server: $schema=../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# Фреймворк-клей (App\Infrastructure): внешние ресурсы, общие для всех модулей.
# Нижний слой — на него не ссылаются контроллеры/UseCase (phparkitect, правило 1/7).

parameters:
    # Фолбэк версии сборки для app_build_info{version}, когда APP_VERSION не задан
    # (синтаксис env(default:...) требует ИМЯ параметра, не литерал).
    app_version_default: 'dev'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Redis-клиент: live-состояние, rate limit, кэш
    # (явный аргумент REDIS_URL — autowire не подставляет string)
    Redis:
        class: Redis
        factory: ['App\Infrastructure\Redis\RedisFactory', 'create']
        arguments:
            - '%env(REDIS_URL)%'

    # AMQP-соединение (RabbitMQ; messenger async-транспорт)
    AMQPConnection:
        class: AMQPConnection
        factory: ['App\Infrastructure\Amqp\AmqpConnectionFactory', 'create']
        arguments:
            - '%env(RABBITMQ_URL)%'

    # Prometheus-реестр метрик (Redis-хранилище, префикс tender_prometheus_).
    # Коллекторы/подписчики (App\Infrastructure\Metrics) autowire'ят этот сервис.
    Prometheus\CollectorRegistry:
        factory: ['@App\Infrastructure\Metrics\MetricsRegistry', 'getCollectorRegistry']

    # Версия сборки для app_build_info{version} (см. MetricsController).
    # Значение по умолчанию — параметр app_version_default (APP_VERSION не задан).
    App\Infrastructure\Http\MetricsController:
        arguments:
            $version: '%env(default:app_version_default:APP_VERSION)%'
