# Tender Platform — dev-окружение (Фаза 0)
# Состав: app (php:8.5-fpm), web (nginx), db (postgres:17), redis:7,
#        rabbitmq:4-management, mercure (dunglas/mercure), mailpit,
#        worker, webhooks, scheduler
# Observability (ops/observability.md): prometheus, grafana,
#        postgres-exporter, redis-exporter, php-fpm-exporter
# Профили: dev (default), test (app+db+redis без внешних), prod (multi-stage)

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    environment: &app-env
      APP_ENV: dev
      APP_DEBUG: "1"
      DATABASE_URL: postgresql://tender:tender@db:5432/tender?serverVersion=17&charset=utf8
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://tender:tender@rabbitmq:5672/%2Ftender
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3008/.well-known/mercure
      MERCURE_PUBLISH_URL: http://mercure/.well-known/mercure
      MERCURE_JWT_SECRET_PUBLISH: '!ChangeMePublisherKey!change-me-32-char-minimum'
      MERCURE_JWT_SECRET_SUBSCRIBE: '!ChangeMeSubscriberKey!change-me-32-char-minimum'
      MERCURE_SUBSCRIBE_TTL: "3600"
      MAILER_DSN: smtp://mailpit:1025
      FILES_STORAGE: local
      FILES_LOCAL_DIR: /var/www/var/files
      DOCUMENT_MAX_FILE_BYTES: "20971520"
      DOMAIN_TIMEZONE: Europe/Moscow
      COUNTER_SNAPSHOT_INTERVAL: "300"
      AUCTION_HEARTBEAT_TIMEOUT: "300"
      # Общий rate-limit api_global (RL-1); для нагрузочных прогонов поднимается
      # через docker-compose.load.yml (см. app/load/README.md).
      RATE_LIMIT_GLOBAL_PER_MIN: "600"
    volumes:
      - ./:/var/www
      # php-fpm status endpoint (pm.status_path) для php-fpm-exporter —
      # см. docker/php/zz-status.conf и ops/observability.md §1.
      - ./docker/php/zz-status.conf:/usr/local/etc/php-fpm.d/zz-status.conf:ro
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mercure: { condition: service_healthy }

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tender
      POSTGRES_PASSWORD: tender
      POSTGRES_DB: tender
    ports:
      - "54329:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender -d tender"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: tender
      RABBITMQ_DEFAULT_PASS: tender
      RABBITMQ_DEFAULT_VHOST: /tender
    ports:
      - "55672:15672"   # management UI
      - "55673:5672"    # amqp
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mercure:
    # ВНИМАНИЕ: пиним v0.16 (не latest!). latest = Mercure 2.x, где JWT-авторизация
    # переведена на OAuth2 authorization_details (RFC 9396) — а приложение использует
    # symfony/mercure 0.7.x с легаси-claims (mercure.publish/subscribe, FR-1.3.4/ADR-003).
    # На v2-хабе легаси-claims не работают (publish → 401), SSE-стримы аукционов
    # сломаны. v0.16 — последняя ветка с прежним API.
    #
    # Собираем из исходников v0.16.3 + локальный патч /metrics (docker/mercure/):
    # v0.16 уже собирает mercure_* метрики в DefaultRegisterer, но Caddy-модуль
    # не регистрирует /metrics (404 в официальном образе) — патч отдаёт рендер
    # реестра по /metrics (ops/observability.md §1, Prometheus job "mercure").
    build:
      context: .
      dockerfile: docker/mercure/Dockerfile
    image: tender-mercure:dev
    environment:
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3008/.well-known/mercure
      # Новые версии: раздельные ключи publisher/subscriber (HS256)
      MERCURE_PUBLISHER_JWT_KEY: '!ChangeMePublisherKey!change-me-32-char-minimum'
      MERCURE_SUBSCRIBER_JWT_KEY: '!ChangeMeSubscriberKey!change-me-32-char-minimum'
      # Dev: hub без TLS — форсируем plain HTTP (Caddy по умолчанию включает
      # auto-HTTPS и 308-редирект на https://localhost, что делает SSE-хаб
      # недоступным по http:// в dev). Требуется для SSE-нагрузки (k6).
      SERVER_NAME: "http://localhost http://mercure"
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8080
        anonymous 0
    ports:
      - "3008:80"
    healthcheck:
      # GET /.well-known/mercure без JWT возвращает 401/400 — это нормальный
      # ответ живого сервиса. Проверяем живость процесса (Caddy) — надёжно и
      # без ложных unhealthy.
      test: ["CMD", "pgrep", "caddy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # UI
      - "1025:1025"   # SMTP

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    environment: *app-env
    volumes:
      - ./:/var/www
    # outbox:relay (фоновый) + messenger:consume (основной) — см. docker/worker-entrypoint.sh
    command: ["sh", "/var/www/docker/worker-entrypoint.sh"]
    depends_on:
      app: { condition: service_started }

  # Отдельный worker только на webhook-доставку (WH-6): общий worker циклит по
  # транспортам async/emails/live/exports, и пустые очереди тормозят выборку
  # webhook-задач (~10 доставок/сек против ~1200+/мин на выделенном — находка
  # load/README.md §5). Доставка — HTTP к подписчикам, она не должна делить
  # процесс с доменными событиями/почтой/экспортом.
  webhooks:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    environment: *app-env
    volumes:
      - ./:/var/www
    command: ["php", "/var/www/bin/console", "messenger:consume", "webhooks", "-vv"]
    depends_on:
      app: { condition: service_started }

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    environment: *app-env
    volumes:
      - ./:/var/www
    # Периодические задачи (heartbeat/снапшоты/cleanup/digest) —
    # см. docker/scheduler-entrypoint.sh (scheduler:run не существует).
    command: ["sh", "/var/www/docker/scheduler-entrypoint.sh"]
    depends_on:
      app: { condition: service_started }

  # ---------- Observability (ops/observability.md) ----------
  # Все сервисы — dev-профиль по умолчанию; поднимаются отдельно через
  # make observability-up (или docker compose up -d prometheus grafana ...).

  prometheus:
    # v2.x — стабильная ветка (v3 вышла, но стек рассчитан на v2-совместимые
    # конфигурации/дашборды; тег запинен).
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./docker/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./docker/prometheus/pg-queries.yaml:/etc/prometheus/pg-queries.yaml:ro
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      web: { condition: service_started }

  grafana:
    image: grafana/grafana:11.6.16
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin   # только dev; в prod — секрет из env
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: postgresql://tender:tender@db:5432/tender?sslmode=disable
      # Кастомные query (размер партиций audit_log/auction_bids, долгие запросы) —
      # флаг --extend.query-path (PG_EXPORTER_EXTEND_QUERY_PATH), см. pg-queries.yaml.
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./docker/prometheus/pg-queries.yaml:/etc/postgres_exporter/queries.yaml:ro

  redis-exporter:
    image: oliver006/redis_exporter:v1.89.0
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis:6379

  php-fpm-exporter:
    image: hipages/php-fpm_exporter:2.2.0
    ports:
      - "9253:9253"
    environment:
      # hipages/php-fpm_exporter подключается напрямую по FastCGI (не HTTP!):
      # tcp://app:9000/status → pm.status_path=/status (docker/php/zz-status.conf).
      # nginx location = /status (default.conf) остаётся для ручной проверки.
      PHP_FPM_SCRAPE_URI: tcp://app:9000/status

  # Внешний аптайм-чек (observability-roadmap.md #9): probe на /health/ready
  # через web:80. Алерт HealthReadyDown (docker/prometheus/alerts.yml).
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    ports:
      - "9115:9115"
    volumes:
      - ./docker/prometheus/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  db_data:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  prometheus_data:
  grafana_data:
